<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>eCheckroll - Sistem Pintar</title>
    
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== KESELURUHAN & DESKTOP (TIDAK DIUBAH) ===== */
        * { box-sizing: border-box; font-family: 'Calibri', 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        .container { 
            display: flex; flex-direction: column; height: 100vh; 
            max-width: 100%; background: white; 
            padding: 8px 15px; 
            overflow: hidden;
        }

        .header-area { flex-shrink: 0; }
        .header {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 8px; margin-bottom: 4px; background: #fff9c4; padding: 6px;
            border-radius: 4px; border: 1px solid #fbc02d; font-weight: bold; text-align: center;
        }
        .header select, .header input { padding: 3px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; width: 100%; text-align: center; font-weight: bold; }
        .header label { display: block; font-size: 11px; color: #555; margin-bottom: 1px; }

        .action-bar { display: flex; gap: 5px; align-items: center; margin: 3px 0; flex-wrap: wrap; flex-shrink: 0; }
        .btn { padding: 4px 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .btn-primary { background: #2e7d32; color: white; }
        .btn-danger { background: #c62828; color: white; }
        .btn-outline { background: white; border: 1px solid #2e7d32; color: #2e7d32; }
        .btn-print { background: #f57c00; color: white; }
        .btn-logout { background: #757575; color: white; margin-left: auto; }
        .btn-sm { padding: 3px 8px; font-size: 11px; }

        /* ===== FIX MOBILE VIEW: TAB KUMPULAN BOLEH SCROLL ===== */
        .tabs-container { 
            display: flex; 
            border-bottom: 1px solid #b0bec5; 
            margin-bottom: 2px; 
            background: #f5f5f5; 
            padding-top: 2px; 
            flex-shrink: 0; 
            
            /* Tambahan untuk mobile scroll (tidak menjejaskan desktop) */
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            flex-wrap: nowrap; /* Paksa satu baris */
        }
        /* Bar skrol nipis untuk Android & iOS */
        .tabs-container::-webkit-scrollbar { height: 4px; }
        .tabs-container::-webkit-scrollbar-thumb { background: #b0bec5; border-radius: 4px; }

        .tab-item { 
            display: inline-flex; /* Kekal dalam satu baris */
            padding: 4px 12px; 
            border: 1px solid #b0bec5; 
            border-bottom: none; 
            background: #e0e0e0; 
            border-radius: 4px 4px 0 0; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: bold; 
            margin-right: 2px; 
            align-items: center; 
            gap: 5px; 
            flex-shrink: 0; /* Jangan mampatkan tab */
        }
        .tab-item.active { background: white; border-bottom: 2px solid white; }
        .tab-item .close-tab { color: #c62828; cursor: pointer; font-weight: bold; margin-left: 5px; font-size: 14px; }
        .btn-add-tab { background: none; border: none; color: #2e7d32; font-size: 18px; cursor: pointer; padding: 0 8px; flex-shrink: 0; }
        .tab-item .tab-name { display: inline-block; cursor: text; padding: 0 4px; }
        .tab-item .tab-name-input { display: none; background: transparent; border: none; font-size: 12px; font-weight: bold; outline: none; width: 80px; text-align: center; font-family: inherit; }

        .main-layout { display: flex; gap: 8px; flex-grow: 1; overflow: hidden; }

        .side-panel { 
            width: 110px; 
            background: linear-gradient(135deg, #c62828, #b71c1c);
            border: 2px solid #8e0000; border-radius: 8px; 
            padding: 10px; overflow-y: auto; flex-shrink: 0; text-align: center;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 4px 8px rgba(0,0,0,0.3);
            color: white;
        }
        .side-panel h5 { margin: 6px 0; font-size: 13px; color: #ffffff; cursor: pointer; font-weight: bold; }
        .side-panel h5:hover { color: #ffeb3b; }
        .month-list { padding-left: 5px; display: none; font-size: 12px; }
        .month-list.open { display: block; }
        .month-item { padding: 2px 0; cursor: pointer; color: #ffcdd2; }
        .month-item:hover { color: #ffffff; font-weight: bold; }
        .month-item.active-bold { color: #ffeb3b; font-weight: bold; }

        .table-wrapper { flex-grow: 1; overflow: auto; position: relative; border: 1px solid #dee2e6; border-radius: 4px; }
        .echeckroll-table {
            width: 100%; border-collapse: collapse; font-size: 11px;
        }
        .echeckroll-table th, .echeckroll-table td {
            border: 1px solid #b0bec5; padding: 1px 2px;
            text-align: center; vertical-align: middle; min-width: 14px;
        }
        .echeckroll-table th { background: #e3f2fd; font-weight: bold; font-size: 10px; }
        .echeckroll-table .row-label { background: #f5f5f5; font-weight: bold; text-align: left; padding-left: 6px; font-size: 11px; white-space: nowrap; }
        .echeckroll-table .worker-header-row { background: #fff9c4; font-weight: bold; }
        .echeckroll-table .worker-data-row { background: #ffffff; }
        .echeckroll-table .off-day { background: #ffcdd2 !important; color: #c62828; font-weight: bold; }
        .echeckroll-table .highlight-col { background: #ffecb3; }
        .echeckroll-table .total-row { background: #e8f5e9; font-weight: bold; }
        .echeckroll-table .gross-row { background: #fff3e0; font-weight: bold; }
        .echeckroll-table .deduction-row { background: #ffebee; }
        .echeckroll-table .net-row { background: #c8e6c9; font-weight: bold; font-size: 13px; }

        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .editable-input { width: 100%; border: none; background: transparent; text-align: center; font-size: 11px; padding: 0; font-family: inherit; }
        .editable-input:focus { outline: 2px solid #2e7d32; background: #e8f5e9; }
        .editable-input.number { text-align: right; padding-right: 2px; }
        .editable-input:disabled { background: #e0e0e0; color: #777; }
        .daily-input { width: 100%; border: none; background: #fffde7; text-align: center; font-size: 11px; padding: 2px 0; }
        .daily-input:focus { outline: 2px solid #1976d2; background: #ffffff; }
        .daily-input:disabled { background: #e0e0e0; color: #777; }

        .check-sm { width: 14px; height: 14px; cursor: pointer; }
        .check-afc { accent-color: #1976d2; }
        .check-fc { accent-color: #2e7d32; }
        .check-sm:disabled { cursor: not-allowed; }
        .del-btn { color: #c62828; cursor: pointer; font-weight: bold; font-size: 13px; padding: 0 4px; }

        @media print {
            .action-bar, .btn, .side-panel, .tabs-container { display: none !important; }
            .container { padding: 0; height: auto; overflow: visible; }
            .table-wrapper { overflow: visible; }
        }

        /* ===== MOBILE RESPONSIVE (TANPA MENGUBAH DESIGN ASAL) ===== */
        @media (max-width: 768px) {
            .header { grid-template-columns: 1fr; gap: 5px; }
            .main-layout { flex-direction: column; }
            .side-panel { width: 100%; display: flex; flex-wrap: wrap; padding: 5px; overflow-x: auto; }
            .side-panel h5 { flex: 1; min-width: 60px; }
            .month-list { display: flex !important; flex-wrap: wrap; gap: 5px; padding: 0; }
            .month-item { padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); }
            
            /* Pastikan tab Kumpulan tidak pecah baris dan boleh scroll */
            .tabs-container {
                padding-bottom: 5px; /* Ruang untuk scrollbar */
            }
        }
    </style>
</head>
<body>

<div id="appArea">
    <div class="container">
        <div class="header-area">
            <div class="header">
                <div>
                    <label>BULAN</label>
                    <select id="bulan" onchange="updateCalendar()">
                        <option value="0">JANUARI</option><option value="1">FEBRUARI</option>
                        <option value="2">MAC</option><option value="3">APRIL</option>
                        <option value="4">MEI</option><option value="5">JUN</option>
                        <option value="6" selected>JULAI</option><option value="7">OGOS</option>
                        <option value="8">SEPTEMBER</option><option value="9">OKTOBER</option>
                        <option value="10">NOVEMBER</option><option value="11">DISEMBER</option>
                    </select>
                </div>
                <div>
                    <label>TAHUN</label>
                    <select id="tahun" onchange="updateCalendar()">
                        <option value="2020">2020</option><option value="2021">2021</option>
                        <option value="2022">2022</option><option value="2023">2023</option>
                        <option value="2024">2024</option><option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option><option value="2028">2028</option>
                        <option value="2029">2029</option><option value="2030">2030</option>
                    </select>
                </div>
                <div>
                    <label>RANCANGAN</label>
                    <input type="text" id="kumpulan" value="Lurah Bilut" placeholder="Nama Rancangan">
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-primary btn-sm" onclick="kiraSemua()">🔄 Kira</button>
                <button class="btn btn-outline btn-sm" onclick="tambahPekerja()">➕ Tambah Pekerja</button>
                <button class="btn btn-print btn-sm" onclick="window.print()">🖨️ Cetak</button>
                <button class="btn btn-outline btn-sm" onclick="simpanData()" style="background:#e3f2fd; border-color:#1976d2;">💾 Simpan Data</button>
                
                <label style="font-size:11px; display:flex; align-items:center; gap:4px; background:#f5f5f5; padding:2px 6px; border-radius:4px; cursor:pointer;">
                    <input type="checkbox" id="syncCheck" onchange="toggleSync()"> Produktiviti Sama (Kuantiti harian)
                </label>
                
                <div style="font-size:11px; font-weight:bold; color:#555; margin-left:10px;">
                    Status: <span id="statusTutup">Buka</span>
                </div>
                <button id="btnTutup" class="btn btn-danger btn-sm" onclick="toggleTutup()" style="display:none;">🔒 Tutup</button>
                <button id="btnBuka" class="btn btn-outline btn-sm" onclick="toggleTutup()" style="display:none;">🔓 Buka</button>
                <span style="font-size:11px; color:#888; margin-left:auto;" id="userLabel"></span>
                <button class="btn btn-logout btn-sm" onclick="doLogout()">🚪 Keluar</button>
            </div>

            <div class="tabs-container" id="tabsContainer">
                <!-- Rendered by JS -->
            </div>
        </div>

        <div class="main-layout">
            <div class="side-panel" id="sidePanel">
                <!-- Populated by JS -->
            </div>

            <div class="table-wrapper">
                <table class="echeckroll-table" id="mainTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  SECTION 1: LOGIN CHECK
    // ============================================================
    const validUsers = {
        '1234': { id: '1234', pass: 'init1234', role: 'FS', name: 'FS 1 Lurah Bilut' },
        '1235': { id: '1235', pass: 'init1234', role: 'FS', name: 'FS 2 Lurah Bilut' },
        '1236': { id: '1236', pass: 'init1234', role: 'FS', name: 'FS 3 Lurah Bilut' },
        '1237': { id: '1237', pass: 'init1234', role: 'AFC', name: 'AFC Lurah Bilut' },
        '1238': { id: '1238', pass: 'init1234', role: 'FC', name: 'FC Lurah Bilut' }
    };
    let currentUser = null;
    let isClosed = false;
    let syncEnabled = false;

    function checkUser() {
        const storedId = localStorage.getItem('echeckroll_user_id');
        const user = validUsers[storedId];
        if (!user || user.role === 'ADMIN') { window.location.href = 'login.html'; return; }
        currentUser = user;
        document.getElementById('userLabel').innerText = user.name + ' (' + user.role + ')';
        updateButtons();
        renderSidePanel();
        initSampleData();
        renderTabs();
        updateCalendar();
    }

    function doLogout() {
        localStorage.removeItem('echeckroll_user_id');
        localStorage.removeItem('echeckroll_user_role');
        localStorage.removeItem('echeckroll_user_name');
        window.location.href = 'login.html';
    }

    // ============================================================
    //  SECTION 2: DATA STRUCTURE & SAVE/LOAD
    // ============================================================
    let daysInMonth = 31;
    let offDayIndices = [];
    let groups = [];
    let currentGroupIndex = 0;
    let nextGroupId = 10; 

    function createEmptyMonth() {
        groups = []; currentGroupIndex = 0; nextGroupId = 1; isClosed = false;
    }

    function simpanData() {
        const bulan = document.getElementById('bulan').value;
        const tahun = document.getElementById('tahun').value;
        const key = `echeckroll_data_${tahun}_${bulan}`;
        const dataToSave = { groups: groups, isClosed: isClosed, currentGroupIndex: currentGroupIndex, nextGroupId: nextGroupId };
        localStorage.setItem(key, JSON.stringify(dataToSave));
        alert('✅ Data untuk ' + document.getElementById('bulan').options[bulan].text + ' ' + tahun + ' telah disimpan!');
    }

    initSampleData = function() {
        const bulan = document.getElementById('bulan').value;
        const tahun = document.getElementById('tahun').value;
        const key = `echeckroll_data_${tahun}_${bulan}`;
        const saved = localStorage.getItem(key);
        if (saved) {
            const data = JSON.parse(saved);
            groups = data.groups; isClosed = data.isClosed || false; currentGroupIndex = data.currentGroupIndex || 0; nextGroupId = data.nextGroupId || 1;
        } else {
            createEmptyMonth();
        }
    };

    // ============================================================
    //  SECTION 3: SIDEBAR & CALENDAR
    // ============================================================
    function renderSidePanel() {
        const panel = document.getElementById('sidePanel');
        let html = '';
        const currentMonth = parseInt(document.getElementById('bulan').value);
        const months = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis'];
        for (let y = 2026; y <= 2027; y++) {
            html += `<h5 onclick="toggleYear(${y})">${y} <span id="arrow-${y}">▶</span></h5>`;
            html += `<div class="month-list" id="year-${y}">`;
            months.forEach((m, i) => {
                const isActive = (y === 2026 && i === currentMonth);
                const activeClass = isActive ? 'active-bold' : '';
                html += `<div class="month-item ${activeClass}" onclick="switchMonth(${y}, ${i})">${m}</div>`;
            });
            html += `</div>`;
        }
        panel.innerHTML = html;
        document.getElementById('year-2026').classList.add('open');
        document.getElementById('arrow-2026').innerText = '▼';
    }

    function toggleYear(y) {
        const el = document.getElementById(`year-${y}`);
        const arrow = document.getElementById(`arrow-${y}`);
        if (el) { el.classList.toggle('open'); arrow.innerText = el.classList.contains('open') ? '▼' : '▶'; }
    }

    function switchMonth(year, monthIndex) {
        document.getElementById('tahun').value = year;
        document.getElementById('bulan').selectedIndex = monthIndex;
        renderSidePanel(); updateCalendar();
    }

    function getProjectWeeklyOff() {
        const projectId = 'fpm305'; 
        const offDataStr = localStorage.getItem('echeckroll_weekly_offs');
        if (offDataStr) {
            const offData = JSON.parse(offDataStr);
            return offData[projectId] || 'Sunday';
        }
        return 'Sunday';
    }

    function getDayIndex(dayName) {
        const map = { 'Sunday': 0, 'Monday': 1, 'Tuesday': 2, 'Wednesday': 3, 'Thursday': 4, 'Friday': 5, 'Saturday': 6 };
        return map[dayName] !== undefined ? map[dayName] : 0;
    }

    function updateCalendar() {
        const bulan = parseInt(document.getElementById('bulan').value);
        const tahun = parseInt(document.getElementById('tahun').value);
        daysInMonth = new Date(tahun, bulan + 1, 0).getDate();
        const weeklyOffDayName = getProjectWeeklyOff();
        const offDayIndex = getDayIndex(weeklyOffDayName);
        offDayIndices = [];
        for (let d = 1; d <= daysInMonth; d++) {
            const dayOfWeek = new Date(tahun, bulan, d).getDay();
            if (dayOfWeek === offDayIndex) offDayIndices.push(d - 1);
        }
        initSampleData();
        renderTabs();
        renderTable();
    }

    const LEAVE_MAP = {
        'CA': 'CUTI AM', 'CT': 'CUTI TAHUNAN', 'MC': 'CUTI SAKIT', 'CB': 'CUTI BERSALIN',
        'CTG': 'CUTI TANPA GAJI', 'HAJI': 'CUTI HAJI', 'CM': 'CUTI MINGGUAN', 'OFF': 'OFF',
        'WAD': 'CUTI SAKIT WAD', 'CBN': 'CUTI BENCANA', 'CP': 'CUTI PATERNITI',
        'CE': 'CUTI EHSAN', 'CK': 'CUTI KUARANTIN', 'H': 'HADIR HARI BIASA',
        'HHM': 'HADIR HARI MINGGU', 'HCU': 'HADIR HARI CUTI UMUM', 'RT': 'RUKUN TETANGGA',
        'RELA': 'RELA/ASKAR WATANIAH', 'KS': 'KESATUAN', 'CS': 'CACAT SEMENTARA',
        'GK': 'DIGANTUNG KERJA', 'P': 'PONTENG'
    };
    const PAID_LEAVE_CODES = ['CA', 'CT', 'MC', 'CB', 'HAJI', 'CM', 'OFF', 'WAD', 'CBN', 'CP', 'CE', 'CK'];

    // ============================================================
    //  SECTION 4: MASTER SYNC UTILITY FOR ACTIVITIES
    // ============================================================
    function syncActivitiesToAll() {
        const group = groups[currentGroupIndex];
        if (!group || group.workers.length === 0) return;
        // Ambil array aktiviti dari Pekerja Pertama (Master)
        const masterActivities = JSON.parse(JSON.stringify(group.workers[0].aktiviti));
        // Salin ke semua pekerja lain
        group.workers.forEach((w, idx) => {
            if (idx > 0) {
                w.aktiviti = masterActivities.map(a => JSON.parse(JSON.stringify(a)));
            }
        });
    }

    // ============================================================
    //  SECTION 5: RENDER TABLE
    // ============================================================
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const group = groups[currentGroupIndex];
        if (!group) {
            tbody.innerHTML = `<tr><td colspan="40" style="padding:20px; color:#999; text-align:center; border:none;">
                <i class="fas fa-folder-open" style="font-size:24px; display:block; margin-bottom:10px;"></i>
                Tiada kumpulan untuk bulan ini. Klik butang <b>+</b> di atas untuk menambah kumpulan.
            </td></tr>`;
            return;
        }
        const isEditable = !isClosed;

        // ==== 1. RENDER INDIVIDUAL WORKERS ====
        group.workers.forEach((worker, wIdx) => {
            if (!worker.hari || !Array.isArray(worker.hari)) worker.hari = Array(31).fill('');
            if (!worker.aktiviti) worker.aktiviti = [];
            if (!worker.leaveRates) worker.leaveRates = {};

            let workerBlock = document.createElement('tbody');
            workerBlock.className = 'worker-block';

            // --- Header Label Row ---
            let labelRow = document.createElement('tr');
            labelRow.className = 'worker-header-row';
            let labelHtml = `
                <th style="min-width:25px;">Bil</th>
                <th style="min-width:90px;">NAMA</th>
                <th style="min-width:75px;">No. K/P</th>
                <th style="min-width:20px;">U</th>
                <th style="min-width:15px;">J</th>
            `;
            for (let d = 0; d < 31; d++) {
                const isOff = offDayIndices.includes(d);
                const isDisabled = d >= daysInMonth;
                const cls = isOff ? 'off-day' : (isDisabled ? 'disabled' : 'highlight-col');
                const style = isDisabled ? 'background:#e0e0e0; color:#999;' : '';
                labelHtml += `<th class="${cls}" style="${style}min-width:14px;">${(d+1)}</th>`;
            }
            labelHtml += `
                <th style="min-width:30px;">Bil.Hr</th>
                <th style="min-width:35px;">Kadar</th>
                <th style="min-width:45px;">Jumlah</th>
                <th style="min-width:20px; background:#ffebee;">✕</th>
            `;
            labelRow.innerHTML = labelHtml;
            workerBlock.appendChild(labelRow);

            // --- Data Row ---
            let dataRow = document.createElement('tr');
            dataRow.className = 'worker-data-row';
            dataRow.innerHTML = `
                <td style="background:#fff9c4; font-weight:bold; font-size:12px;">${wIdx + 1}</td>
                <td style="background:#fff9c4; font-weight:bold; font-size:12px; text-align:left;">
                    <input type="text" class="editable-input" value="${worker.nama}" ${isEditable ? '' : 'disabled'} onchange="groups[${currentGroupIndex}].workers[${wIdx}].nama = this.value;">
                </td>
                <td style="background:#fff9c4; font-weight:bold; font-size:12px;">
                    <input type="text" class="editable-input" value="${worker.noKP}" ${isEditable ? '' : 'disabled'} onchange="groups[${currentGroupIndex}].workers[${wIdx}].noKP = this.value;">
                </td>
                <td style="background:#fff9c4; font-weight:bold; font-size:12px;">
                    <input type="number" class="editable-input number" value="${worker.umur}" ${isEditable ? '' : 'disabled'} onchange="groups[${currentGroupIndex}].workers[${wIdx}].umur = parseInt(this.value) || 0;">
                </td>
                <td style="background:#fff9c4; font-weight:bold; font-size:12px;">
                    <select class="editable-input" ${isEditable ? '' : 'disabled'} onchange="groups[${currentGroupIndex}].workers[${wIdx}].jantina = this.value;">
                        <option value="L" ${worker.jantina === 'L' ? 'selected' : ''}>L</option>
                        <option value="P" ${worker.jantina === 'P' ? 'selected' : ''}>P</option>
                    </select>
                </td>
            `;

            let totalHariBekerja = 0;
            for (let d = 0; d < 31; d++) {
                const isOff = offDayIndices.includes(d);
                const isDisabled = d >= daysInMonth;
                const bg = isDisabled ? '#e0e0e0' : (isOff ? '#ffcdd2' : '#ffecb3');
                const val = (worker.hari && worker.hari[d]) ? worker.hari[d] : '';
                if (val === '1') totalHariBekerja += 1;
                dataRow.innerHTML += `
                    <td style="background:${bg}; padding:0;">
                        <input type="text" class="daily-input" value="${val}" ${isDisabled || !isEditable ? 'disabled' : ''} onchange="updateKehadiran(${wIdx}, ${d}, this.value)">
                    </td>
                `;
            }
            const totalGajiAktiviti = worker.aktiviti.reduce((sum, act) => sum + (act.kuantitiHarian.reduce((a,b) => a+b, 0) * act.kadar), 0);
            const totalElaun = (worker.elaun_motorsikal || 0) + (worker.elaun_rumah || 0);
            const gajiKasar = totalGajiAktiviti + totalElaun;

            dataRow.innerHTML += `
                <td>${totalHariBekerja}</td>
                <td></td>
                <td>${gajiKasar.toFixed(2)}</td>
                <td style="background:#ffebee; cursor:pointer;" onclick="padamPekerja(${wIdx})">✕</td>
            `;
            workerBlock.appendChild(dataRow);

            // --- Elaun ---
            const elaunList = [
                { label: 'ELAUN MOTORSIKAL', field: 'elaun_motorsikal' },

            ];
            elaunList.forEach((el) => {
                let row = document.createElement('tr');
                row.innerHTML = `<td></td><td class="row-label" style="padding-left:10px;">${el.label}</td><td></td><td></td><td></td>`;

                    const bg = d >= daysInMonth ? '#e0e0e0' : '';
                    row.innerHTML += `<td style="background:${bg};"></td>`;
                }
                row.innerHTML += `<td></td><td></td><td><input type="number" class="editable-input number" value="${worker[el.field]}" ${isEditable ? '' : 'disabled'} step="0.01" onchange="updateElaun(${wIdx}, '${el.field}', this.value);">`;
                workerBlock.appendChild(row);
            });

            // --- Aktiviti Header ---
            let headerActRow = document.createElement('tr');
            headerActRow.style.backgroundColor = '#fff9c4';
            headerActRow.style.borderTop = '2px solid #ddd';
            headerActRow.innerHTML = `
                <td></td>
                <td class="row-label" style="text-align:center; font-weight:bold; padding-left:5px; min-width:180px; border-right:1px solid #b0bec5;">AKTIVITI KERJA</td>
                <td style="border-right:1px solid #b0bec5; font-weight:bold;">KOD</td>
                <td style="border-right:1px solid #b0bec5; font-weight:bold;">PKT</td>
                <td style="font-weight:bold;">BLOK</td>
            `;
            for (let d = 0; d < 31; d++) {
                const bg = d >= daysInMonth ? '#e0e0e0' : '#fffde7';
                headerActRow.innerHTML += `<td style="background:${bg}; border-bottom:1px solid #b0bec5;"></td>`;
            }
            headerActRow.innerHTML += `<td></td><td></td><td></td><td></td>`;
            workerBlock.appendChild(headerActRow);

            // --- Aktiviti Rows ---
            worker.aktiviti.forEach((act, aIdx) => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="del-btn" onclick="padamAktiviti(${wIdx}, ${aIdx})">✕</span></td>
                    <td class="row-label" style="padding-left:4px;">
                        <input list="kuk-list-${currentGroupIndex}" class="editable-input" style="text-align:left; width:100%;" value="${act.kod ? act.kod + ' - ' + act.nama : ''}" placeholder="Taip kod / nama kerja" ${isEditable ? '' : 'disabled'} onchange="updateActName(${wIdx}, ${aIdx}, this.value)">
                        <datalist id="kuk-list-${currentGroupIndex}">
                            <option value="0101 - Menuai Sawit - Buah (kg)">
                            <option value="0201 - Kerja Lebih Masa (jam)">
                            <option value="0301 - Merumput - Kimia (ha)">
                            <option value="0401 - Pengangkutan Buah (tan)">
                        </datalist>
                    </td>
                    <td><input type="text" class="editable-input" value="${act.kod || ''}" ${isEditable ? '' : 'disabled'}></td>
                    <td><input type="text" class="editable-input" value="${act.unit || ''}" placeholder="PKT" ${isEditable ? '' : 'disabled'} onchange="updateActUnit(${wIdx}, ${aIdx}, this.value);"></td>
                    <td><input type="text" class="editable-input" value="${act.blok || ''}" placeholder="Blok" ${isEditable ? '' : 'disabled'} onchange="updateActBlok(${wIdx}, ${aIdx}, this.value);"></td>
                `;

                let totalQty = 0;
                for (let d = 0; d < 31; d++) {
                    const isOff = offDayIndices.includes(d);
                    const dayValue = worker.hari[d] || '';
                    const isLeaveDay = LEAVE_MAP[dayValue] !== undefined;
                    const isDisabled = d >= daysInMonth || !isEditable || isLeaveDay;
                    const bg = (d >= daysInMonth ? '#e0e0e0' : '#fffde7');
                    let val = act.kuantitiHarian[d] || 0;
                    if (val != 0) totalQty += val;
                    row.innerHTML += `<td style="background:${bg}; padding:0;"><input type="number" class="daily-input" value="${val > 0 ? val : ''}" step="0.01" ${isDisabled ? 'disabled' : ''} onchange="updateDailyQty(${wIdx}, ${aIdx}, ${d}, this.value)"></td>`;
                }
                const totalJumlah = totalQty * act.kadar;
                row.innerHTML += `
                    <td class="total-row">${totalQty.toFixed(2)}</td>
                    <td class="total-row"><input type="number" class="editable-input number" style="width:100%;" value="${act.kadar}" ${isEditable ? '' : 'disabled'} step="0.01" onchange="updateActKadar(${wIdx}, ${aIdx}, this.value);"></td>
                    <td class="total-row">${totalJumlah.toFixed(2)}</td>
                    <td></td>
                `;
                workerBlock.appendChild(row);
            });

            // --- Tambah Aktiviti ---
            let addRow = document.createElement('tr');
            addRow.innerHTML = `<td></td><td class="row-label" style="padding-left:4px;"><button class="btn btn-outline btn-sm" onclick="tambahAktiviti(${wIdx})" ${isEditable ? '' : 'disabled'}>➕ Aktiviti</button></td><td></td><td></td><td></td>`;
            for (let d = 0; d < 31; d++) { addRow.innerHTML += `<td style="background:${d>=daysInMonth?'#e0e0e0':''};"></td>`; }
            addRow.innerHTML += `<td></td><td></td><td></td><td></td>`;
            workerBlock.appendChild(addRow);

            // --- Leave Rows ---
            const presentLeaveCodes = [];
            const leaveCounts = {};
            for (let d = 0; d < 31; d++) {
                const val = worker.hari[d] || '';
                if (LEAVE_MAP[val]) {
                    if (!leaveCounts[val]) { presentLeaveCodes.push(val); leaveCounts[val] = 1; } 
                    else { leaveCounts[val]++; }
                }
            }

            if (presentLeaveCodes.length > 0) {
                presentLeaveCodes.forEach(code => {
                    const label = LEAVE_MAP[code];
                    const isPaidLeave = PAID_LEAVE_CODES.includes(code);
                    const currentRate = worker.leaveRates[code] || 0;
                    const totalCuti = leaveCounts[code] || 0;
                    const totalJumlahCuti = totalCuti * currentRate;

                    let row = document.createElement('tr');
                    row.style.backgroundColor = '#e3f2fd';
                    row.innerHTML = `
                        <td></td>
                        <td class="row-label" style="text-align:center; font-weight:bold; padding-left:5px; border-right:1px solid #b0bec5;">${label}</td>
                        <td></td><td></td><td></td>
                    `;
                    for (let d = 0; d < 31; d++) {
                        const val = worker.hari[d] || '';
                        const isCuti = val === code;
                        const isOff = offDayIndices.includes(d);
                        const bg = isOff ? '#ffcdd2' : (d >= daysInMonth ? '#e0e0e0' : '');
                        row.innerHTML += `<td style="background:${bg};">${isCuti ? '1' : ''}</td>`;
                    }
                    row.innerHTML += `
                        <td class="total-row">${totalCuti}</td>

                        <td></td>
                    `;

            dividerRow.style.borderTop = '1px solid #b0bec5';
            dividerRow.style.borderBottom = '1px solid #b0bec5';
            dividerRow.innerHTML = `<td colspan="42" style="height:3px; padding:0;"></td>`;
            workerBlock.appendChild(dividerRow);

            // --- Gaji Kasar ---
            let totalLeaveAmount = 0;
            presentLeaveCodes.forEach(code => {
                if (PAID_LEAVE_CODES.includes(code)) totalLeaveAmount += (leaveCounts[code] || 0) * (worker.leaveRates[code] || 0);
            });
            const gajiKasarWithLeave = gajiKasar + totalLeaveAmount;

            let grossRow = document.createElement('tr');
            grossRow.innerHTML = `<td></td><td class="gross-row" style="text-align:left; padding-left:8px;">GAJI KASAR</td><td></td><td></td><td></td>`;
            for (let d = 0; d < 31; d++) { grossRow.innerHTML += `<td style="background:${d>=daysInMonth?'#e0e0e0':''};"></td>`; }
            grossRow.innerHTML += `<td></td><td></td><td class="gross-row">${gajiKasarWithLeave.toFixed(2)}</td><td></td>`;
            workerBlock.appendChild(grossRow);

            // --- Potongan Rows ---
            worker.potongan.forEach((p, pIdx) => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="del-btn" onclick="padamPotongan(${wIdx}, ${pIdx})">✕</span></td>
                    <td class="deduction-row" style="text-align:left; padding-left:8px;">
                        <input type="text" class="editable-input" style="text-align:left;" value="${p.label}" ${isEditable ? '' : 'disabled'} onchange="updatePotonganLabel(${wIdx}, ${pIdx}, this.value);">
                    </td>
                    <td></td><td></td><td></td>
                    <td colspan="31" style="background:#f5f5f5; border-left:1px solid #b0bec5; border-right:1px solid #b0bec5;"></td>
                    <td></td><td></td>
                    <td class="deduction-row"><input type="number" class="editable-input number" value="${p.nilai}" ${isEditable ? '' : 'disabled'} step="0.01" onchange="updatePotonganNilai(${wIdx}, ${pIdx}, this.value);"></td>

                `;
                workerBlock.appendChild(row);

            let addDedRow = document.createElement('tr');
            addDedRow.innerHTML = `<td></td><td class="row-label" style="padding-left:8px;"><button class="btn btn-outline btn-sm" onclick="tambahPotongan(${wIdx})" ${isEditable ? '' : 'disabled'}>➕ Tambah Potongan</button></td><td></td><td></td><td></td><td colspan="31" style="background:#f5f5f5; border-left:1px solid #b0bec5; border-right:1px solid #b0bec5;"></td><td></td><td></td><td></td><td></td>`;
            workerBlock.appendChild(addDedRow);

            // --- Gaji Bersih ---
            const totalPotongan = worker.potongan.reduce((sum, p) => sum + (p.nilai || 0), 0);
            const gajiBersih = gajiKasarWithLeave - totalPotongan;
            let netRow = document.createElement('tr');
            netRow.innerHTML = `<td></td><td class="net-row" style="text-align:left; padding-left:8px;">GAJI BERSIH</td><td></td><td></td><td></td>`;
            for (let d = 0; d < 31; d++) { netRow.innerHTML += `<td style="background:${d>=daysInMonth?'#e0e0e0':''};"></td>`; }
            netRow.innerHTML += `<td></td><td></td><td class="net-row">${gajiBersih.toFixed(2)}</td><td></td>`;
            workerBlock.appendChild(netRow);

            let spacer = document.createElement('tr');
            spacer.style.backgroundColor = '#ffffff';
            spacer.innerHTML = `<td colspan="42" style="height:15px; border:none; padding:0;"></td>`;
            workerBlock.appendChild(spacer);
            tbody.appendChild(workerBlock);
        });

        // ==== 2. SUMMARY BLOCK (Rumusan) ====
        if (group.workers.length > 0) {
            let summaryBlock = document.createElement('tbody');
            summaryBlock.className = 'summary-block';

            let allActivities = {};
            let allLeaves = {};
            let allDeductions = {};
            let totalHari = 0;
            let totalGrossAll = 0;
            let totalNetAll = 0;
            let sumElaunMotor = 0, sumElaunRumah = 0;

            group.workers.forEach(worker => {
                worker.hari.forEach(val => { if (val === '1') totalHari++; });
                sumElaunMotor += worker.elaun_motorsikal || 0;
                sumElaunRumah += worker.elaun_rumah || 0;

                let workerGross = 0;
                worker.aktiviti.forEach(act => {
                    let sum = act.kuantitiHarian.reduce((a,b) => a+b, 0);
                    workerGross += sum * act.kadar;
                    
                    let key = (act.kod || '') + '|' + (act.unit || '') + '|' + (act.blok || '');
                    
                    if (!allActivities[key]) {
                        let firstWorkerRate = 0;
                        if (group.workers.length > 0) {
                            const match = group.workers[0].aktiviti.find(a => 
                                ((a.kod || '') + '|' + (a.unit || '') + '|' + (a.blok || '')) === key
                            );
                            if (match) firstWorkerRate = match.kadar || 0;
                        }
                        
                        allActivities[key] = { 
                            kod: act.kod, 
                            nama: act.nama, 
                            unit: act.unit, 
                            blok: act.blok,
                            kadar: firstWorkerRate,
                            totalQty: 0, 
                            totalAmount: 0, 
                            dailySums: Array(31).fill(0) 
                        };
                    }
                    allActivities[key].totalQty += sum;
                    allActivities[key].totalAmount += sum * act.kadar;
                    for (let d = 0; d < 31; d++) {
                        allActivities[key].dailySums[d] += (act.kuantitiHarian[d] || 0);
                    }
                });

                Object.keys(worker.leaveRates).forEach(code => {
                    if (PAID_LEAVE_CODES.includes(code)) {
                        let count = 0;
                        worker.hari.forEach(val => { if (val === code) count++; });
                        workerGross += count * (worker.leaveRates[code] || 0);
                    }
                });
                totalGrossAll += workerGross;

                worker.hari.forEach((val, idx) => {
                    if (LEAVE_MAP[val]) {
                        let code = val;
                        if (!allLeaves[code]) {
                            allLeaves[code] = { 
                                code: code, 
                                label: LEAVE_MAP[code], 
                                dailyCount: Array(31).fill(0),
                                totalCount: 0, 
                                totalRates: 0,
                                numWorkers: 0
                            };
                        }
                        allLeaves[code].dailyCount[idx]++;
                        allLeaves[code].totalCount++;
                        if (PAID_LEAVE_CODES.includes(code)) {
                            allLeaves[code].totalRates += (worker.leaveRates[code] || 0);
                            allLeaves[code].numWorkers++;
                        }
                    }
                });

                worker.potongan.forEach(p => {
                    if (!allDeductions[p.label]) allDeductions[p.label] = 0;
                    allDeductions[p.label] += p.nilai;
                });

                let totalPotongan = worker.potongan.reduce((sum, p) => sum + (p.nilai || 0), 0);
                totalNetAll += (workerGross - totalPotongan);
            });

            // --- 1. Summary Header Row ---
            let sumLabelRow = document.createElement('tr');
            sumLabelRow.className = 'worker-header-row';
            let sumLabelHtml = `
                <th style="min-width:25px;">Bil</th>
                <th style="min-width:90px;">NAMA</th>
                <th style="min-width:75px;">No. K/P</th>
                <th style="min-width:20px;">U</th>
                <th style="min-width:15px;">J</th>
            `;
            for (let d = 0; d < 31; d++) {
                const isOff = offDayIndices.includes(d);
                const isDisabled = d >= daysInMonth;
                const cls = isOff ? 'off-day' : (isDisabled ? 'disabled' : 'highlight-col');
                const style = isDisabled ? 'background:#e0e0e0; color:#999;' : '';
                sumLabelHtml += `<th class="${cls}" style="${style}min-width:14px;">${(d+1)}</th>`;
            }
            sumLabelHtml += `
                <th style="min-width:30px;">Bil.Hr</th>
                <th style="min-width:35px;">Kadar</th>
                <th style="min-width:45px;">Jumlah</th>
                <th style="min-width:20px; background:#ffebee;">✕</th>
            `;
            sumLabelRow.innerHTML = sumLabelHtml;
            summaryBlock.appendChild(sumLabelRow);

            // --- 2. Summary Data Row ---
            let sumDataRow = document.createElement('tr');
            sumDataRow.className = 'worker-data-row';
            sumDataRow.innerHTML = `
                <td style="background:#fff9c4; font-weight:bold; font-size:12px;">R</td>
                <td style="background:#fff9c4; font-weight:bold; font-size:12px; text-align:left;">
                    <input type="text" class="editable-input" value="RUMUSAN" disabled>
                </td>
                <td style="background:#fff9c4; font-weight:bold; font-size:12px;"></td>
                <td style="background:#fff9c4; font-weight:bold; font-size:12px;"></td>
                <td style="background:#fff9c4; font-weight:bold; font-size:12px;"></td>
            `;
            for (let d = 0; d < 31; d++) {
                const isOff = offDayIndices.includes(d);
                const isDisabled = d >= daysInMonth;
                const bg = isDisabled ? '#e0e0e0' : (isOff ? '#ffcdd2' : '#ffecb3');
                let daySum = 0;
                group.workers.forEach(w => {
                    const val = w.hari[d];
                    if (val && !isNaN(parseFloat(val))) daySum += parseFloat(val);
                });
                sumDataRow.innerHTML += `<td style="background:${bg}; padding:0;">${daySum > 0 ? daySum : ''}</td>`;
            }
            sumDataRow.innerHTML += `
                <td class="total-row">${totalHari}</td>
                <td></td>
                <td class="total-row">${totalGrossAll.toFixed(2)}</td>
                <td style="background:#ffebee;"></td>
            `;
            summaryBlock.appendChild(sumDataRow);

            // --- 3. Summary Elaun ---
            let sumElaun1 = document.createElement('tr');
            sumElaun1.innerHTML = `<td></td><td class="row-label" style="padding-left:10px;">ELAUN MOTORSIKAL (Jumlah)</td><td></td><td></td><td></td>`;
            for (let d = 0; d < 31; d++) { sumElaun1.innerHTML += `<td></td>`; }
            sumElaun1.innerHTML += `<td></td><td></td><td>${sumElaunMotor.toFixed(2)}</td><td></td>`;
            summaryBlock.appendChild(sumElaun1);

            let sumElaun2 = document.createElement('tr');
            sumElaun2.innerHTML = `<td></td><td class="row-label" style="padding-left:10px;">ELAUN RUMAH (Jumlah)</td><td></td><td></td><td></td>`;
            for (let d = 0; d < 31; d++) { sumElaun2.innerHTML += `<td></td>`; }
            sumElaun2.innerHTML += `<td></td><td></td><td>${sumElaunRumah.toFixed(2)}</td><td></td>`;
            summaryBlock.appendChild(sumElaun2);

            // --- 4. Summary Aktiviti Header ---
            let sumActHeader = document.createElement('tr');
            sumActHeader.style.backgroundColor = '#fff9c4';
            sumActHeader.innerHTML = `
                <td></td>
                <td class="row-label" style="text-align:center; font-weight:bold; padding-left:5px; min-width:180px; border-right:1px solid #b0bec5;">AKTIVITI KERJA (RUMUSAN)</td>
                <td style="border-right:1px solid #b0bec5; font-weight:bold;">KOD</td>
                <td style="border-right:1px solid #b0bec5; font-weight:bold;">PKT</td>
                <td style="font-weight:bold;">BLOK</td>
            `;
            for (let d = 0; d < 31; d++) { sumActHeader.innerHTML += `<td style="background:#fffde7;"></td>`; }
            sumActHeader.innerHTML += `<td></td><td></td><td></td><td></td>`;
            summaryBlock.appendChild(sumActHeader);

            // --- 5. Summary Aktiviti Rows ---
            Object.keys(allActivities).forEach(key => {
                let act = allActivities[key];
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td></td>
                    <td class="row-label" style="padding-left:4px;">${act.nama}</td>
                    <td>${act.kod}</td>
                    <td>${act.unit || ''}</td>
                    <td>${act.blok || ''}</td>
                `;
                for (let d = 0; d < 31; d++) {
                    let val = act.dailySums[d];
                    row.innerHTML += `<td class="total-row">${val > 0 ? val.toFixed(2) : ''}</td>`;
                }
                row.innerHTML += `
                    <td class="total-row">${act.totalQty.toFixed(2)}</td>
                    <td class="total-row">${act.kadar ? act.kadar.toFixed(2) : ''}</td>
                    <td class="total-row">${act.totalAmount.toFixed(2)}</td>
                    <td></td>
                `;
                summaryBlock.appendChild(row);
            });

            // --- 6. Summary Leave Rows ---
            if (Object.keys(allLeaves).length > 0) {
                let sumLeaveHeader = document.createElement('tr');
                sumLeaveHeader.style.backgroundColor = '#e3f2fd';
                sumLeaveHeader.innerHTML = `
                    <td></td>
                    <td class="row-label" style="text-align:center; font-weight:bold; padding-left:5px; border-right:1px solid #b0bec5;">CUTI BERBAYAR (RUMUSAN)</td>
                    <td></td><td></td><td></td>
                `;
                for (let d = 0; d < 31; d++) { sumLeaveHeader.innerHTML += `<td></td>`; }
                sumLeaveHeader.innerHTML += `<td></td><td></td><td></td><td></td>`;
                summaryBlock.appendChild(sumLeaveHeader);

                Object.keys(allLeaves).forEach(code => {
                    let l = allLeaves[code];
                    let isPaid = PAID_LEAVE_CODES.includes(code);
                    
                    let avgRate = l.numWorkers > 0 ? (l.totalRates / l.numWorkers) : 0;
                    let totalAmount = l.totalCount * avgRate;

                    let row = document.createElement('tr');
                    row.style.backgroundColor = '#e3f2fd';
                    row.innerHTML = `
                        <td></td>
                        <td class="row-label" style="text-align:center; font-weight:bold; padding-left:5px; border-right:1px solid #b0bec5;">${l.label}</td>
                        <td></td><td></td><td></td>
                    `;
                    for (let d = 0; d < 31; d++) {
                        let countOnDay = l.dailyCount[d] || 0;
                        const isOff = offDayIndices.includes(d);
                        const bg = isOff ? '#ffcdd2' : (d >= daysInMonth ? '#e0e0e0' : '');
                        row.innerHTML += `<td style="background:${bg};">${countOnDay > 0 ? countOnDay : ''}</td>`;
                    }
                    row.innerHTML += `
                        <td class="total-row">${l.totalCount}</td>
                        <td class="total-row">${isPaid ? avgRate.toFixed(2) : '0.00'}</td>
                        <td class="total-row">${totalAmount.toFixed(2)}</td>
                        <td></td>
                    `;
                    summaryBlock.appendChild(row);
                });
            }

            // --- 7. Summary Divider ---
            let sumDivider = document.createElement('tr');
            sumDivider.style.backgroundColor = '#ffffff';
            sumDivider.style.borderTop = '1px solid #b0bec5';
            sumDivider.style.borderBottom = '1px solid #b0bec5';
            sumDivider.innerHTML = `<td colspan="42" style="height:3px; padding:0;"></td>`;
            summaryBlock.appendChild(sumDivider);

            // --- 8. Summary Gaji Kasar ---
            let sumGrossRow = document.createElement('tr');
            sumGrossRow.innerHTML = `<td></td><td class="gross-row" style="text-align:left; padding-left:8px;">GAJI KASAR (Jumlah)</td><td></td><td></td><td></td>`;
            for (let d = 0; d < 31; d++) { sumGrossRow.innerHTML += `<td style="background:${d>=daysInMonth?'#e0e0e0':''};"></td>`; }
            sumGrossRow.innerHTML += `<td></td><td></td><td class="gross-row">${totalGrossAll.toFixed(2)}</td><td></td>`;
            summaryBlock.appendChild(sumGrossRow);

            // --- 9. Summary AFC/FC Checks ---
            let sumAfcRow = document.createElement('tr');
            sumAfcRow.innerHTML = `
                <td></td>
                <td class="row-label" style="text-align:center; font-weight:bold; background:#e3f2fd;">Disemak AFC (Rumusan)</td>
                <td></td><td></td><td></td>
            `;
            for (let d = 0; d < 31; d++) {
                const isOff = offDayIndices.includes(d);
                const isDisabled = d >= daysInMonth || isClosed;
                const bg = isOff ? '#ffcdd2' : (isDisabled ? '#e0e0e0' : '');
                const isAFC = currentUser && currentUser.role === 'AFC';
                let allChecked = group.workers.every(w => w.afcCheck[d]);
                sumAfcRow.innerHTML += `
                    <td style="background:${bg};">
                        <input type="checkbox" class="check-sm check-afc" ${allChecked ? 'checked' : ''} 
                               ${isDisabled || !isAFC ? 'disabled' : ''}
                               onchange="updateSummaryCheck('afc', ${d}, this.checked)">
                    </td>
                `;
            }
            sumAfcRow.innerHTML += `<td></td><td></td><td></td><td></td>`;
            summaryBlock.appendChild(sumAfcRow);

            let sumFcRow = document.createElement('tr');
            sumFcRow.innerHTML = `
                <td></td>
                <td class="row-label" style="text-align:center; font-weight:bold; background:#e8f5e9;">Disahkan FC (Rumusan)</td>
                <td></td><td></td><td></td>
            `;
            for (let d = 0; d < 31; d++) {
                const isOff = offDayIndices.includes(d);
                const isDisabled = d >= daysInMonth || isClosed;
                const bg = isOff ? '#ffcdd2' : (isDisabled ? '#e0e0e0' : '');
                const isFC = currentUser && currentUser.role === 'FC';
                let allChecked = group.workers.every(w => w.fcCheck[d]);
                sumFcRow.innerHTML += `
                    <td style="background:${bg};">
                        <input type="checkbox" class="check-sm check-fc" ${allChecked ? 'checked' : ''} 
                               ${isDisabled || !isFC ? 'disabled' : ''}
                               onchange="updateSummaryCheck('fc', ${d}, this.checked)">
                    </td>
                `;
            }
            sumFcRow.innerHTML += `<td></td><td></td><td></td><td></td>`;
            summaryBlock.appendChild(sumFcRow);

            // --- 10. Summary Deductions ---
            let sumDedHeader = document.createElement('tr');
            sumDedHeader.style.backgroundColor = '#ffebee';
            sumDedHeader.innerHTML = `
                <td></td>
                <td class="row-label" style="text-align:center; font-weight:bold; padding-left:5px; border-right:1px solid #b0bec5;">POTONGAN (RUMUSAN)</td>
                <td></td><td></td><td></td>
            `;
            for (let d = 0; d < 31; d++) { sumDedHeader.innerHTML += `<td></td>`; }
            sumDedHeader.innerHTML += `<td></td><td></td><td></td><td></td>`;
            summaryBlock.appendChild(sumDedHeader);

            Object.keys(allDeductions).forEach(label => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td></td>
                    <td class="deduction-row" style="text-align:left; padding-left:8px;">${label}</td>
                    <td></td><td></td><td></td>
                    <td colspan="31" style="background:#f5f5f5; border-left:1px solid #b0bec5; border-right:1px solid #b0bec5;"></td>
                    <td></td><td></td>
                    <td class="deduction-row">${allDeductions[label].toFixed(2)}</td>
                    <td></td>
                `;
                summaryBlock.appendChild(row);
            });

            // --- 11. Summary Net Salary ---
            let sumNetRow = document.createElement('tr');
            sumNetRow.innerHTML = `<td></td><td class="net-row" style="text-align:left; padding-left:8px;">GAJI BERSIH (Jumlah)</td><td></td><td></td><td></td>`;
            for (let d = 0; d < 31; d++) { sumNetRow.innerHTML += `<td style="background:${d>=daysInMonth?'#e0e0e0':''};"></td>`; }
            sumNetRow.innerHTML += `<td></td><td></td><td class="net-row">${totalNetAll.toFixed(2)}</td><td></td>`;
            summaryBlock.appendChild(sumNetRow);

            tbody.appendChild(summaryBlock);
        }
    }

    // ============================================================
    //  SECTION 6: LOGIK FUNGSI & SYNC
    // ============================================================
    function toggleSync() { syncEnabled = document.getElementById('syncCheck').checked; }

    function updateKehadiran(wIdx, day, value) {
        groups[currentGroupIndex].workers[wIdx].hari[day] = value;
        renderTable();
    }

    function updateDailyQty(wIdx, aIdx, day, value) {
        const numVal = parseFloat(value);
        const group = groups[currentGroupIndex];
        const worker = group.workers[wIdx];
        worker.aktiviti[aIdx].kuantitiHarian[day] = isNaN(numVal) ? 0 : numVal;
        if (syncEnabled) {
            group.workers.forEach(w => {
                if (w.id !== worker.id && w.aktiviti[aIdx]) {
                    w.aktiviti[aIdx].kuantitiHarian[day] = isNaN(numVal) ? 0 : numVal;
                }
            });
        }
        renderTable();
    }

    function updateActKadar(wIdx, aIdx, value) {
        const rate = parseFloat(value) || 0;
        const group = groups[currentGroupIndex];
        if (group.workers[0] && group.workers[0].aktiviti[aIdx]) {
            group.workers[0].aktiviti[aIdx].kadar = rate;
        }
        syncActivitiesToAll();
        renderTable();
    }

    function updateActName(wIdx, aIdx, value) {
        const group = groups[currentGroupIndex];
        let newKod = '';
        let newNama = value;

        const kodMatch = value.match(/^(\d{4})\s*-\s*(.*)/);
        if (kodMatch) {
            newKod = kodMatch[1];
            newNama = kodMatch[2];
        } else {
            if (value.toLowerCase().includes('menuai')) { newKod = '0101'; newNama = 'Menuai Sawit - Buah (kg)'; }
            else if (value.toLowerCase().includes('lebih masa')) { newKod = '0201'; newNama = 'Kerja Lebih Masa (jam)'; }
            else if (value.toLowerCase().includes('merumput')) { newKod = '0301'; newNama = 'Merumput - Kimia (ha)'; }
            else if (value.toLowerCase().includes('pengangkutan')) { newKod = '0401'; newNama = 'Pengangkutan Buah (tan)'; }
            else {
                newNama = value;
            }
        }

        if (group.workers[0] && group.workers[0].aktiviti[aIdx]) {
            group.workers[0].aktiviti[aIdx].kod = newKod;
            group.workers[0].aktiviti[aIdx].nama = newNama;
        }
        syncActivitiesToAll();
        renderTable();
    }

    function updateActUnit(wIdx, aIdx, value) {
        const group = groups[currentGroupIndex];
        if (group.workers[0] && group.workers[0].aktiviti[aIdx]) {
            group.workers[0].aktiviti[aIdx].unit = value;
        }
        syncActivitiesToAll();
        renderTable();
    }

    function updateActBlok(wIdx, aIdx, value) {
        const group = groups[currentGroupIndex];
        if (group.workers[0] && group.workers[0].aktiviti[aIdx]) {
            group.workers[0].aktiviti[aIdx].blok = value;
        }
        syncActivitiesToAll();
        renderTable();
    }

    function updateElaun(wIdx, field, value) {
        groups[currentGroupIndex].workers[wIdx][field] = parseFloat(value) || 0;
        renderTable();
    }

    function updatePotonganNilai(wIdx, pIdx, value) {
        const val = parseFloat(value) || 0;
        groups[currentGroupIndex].workers[wIdx].potongan[pIdx].nilai = val;
        renderTable(); 
    }

    function updatePotonganLabel(wIdx, pIdx, value) {
        groups[currentGroupIndex].workers[wIdx].potongan[pIdx].label = value;
        renderTable();
    }

    function updateLeaveRate(wIdx, code, value) {
        groups[currentGroupIndex].workers[wIdx].leaveRates[code] = parseFloat(value) || 0;
        renderTable();
    }

    function updateSummaryCheck(role, day, checked) {
        if (isClosed) return;
        const group = groups[currentGroupIndex];
        const roleKey = role === 'afc' ? 'afcCheck' : 'fcCheck';
        group.workers.forEach(w => { w[roleKey][day] = checked; });
        renderTable();
    }

    function updateCheck(wIdx, day, roleKey, checked) {
        if (isClosed) return;
        groups[currentGroupIndex].workers[wIdx][roleKey][day] = checked;
        renderTable();
    }

    function tambahAktiviti(wIdx) {
        const group = groups[currentGroupIndex];
        if (!group.workers[0]) return;
        const newAct = { kod: '', nama: '', unit: '', blok: '', kadar: 0, kuantitiHarian: Array(31).fill(0) };
        group.workers[0].aktiviti.push(JSON.parse(JSON.stringify(newAct)));
        syncActivitiesToAll();
        renderTable();
    }

    function padamAktiviti(wIdx, aIdx) {
        const group = groups[currentGroupIndex];
        if (!group.workers[0]) return;
        if (group.workers[0].aktiviti.length <= 1) { alert('Tidak boleh padam aktiviti terakhir.'); return; }
        if (!confirm('Padam aktiviti ini?')) return;
        group.workers[0].aktiviti.splice(aIdx, 1);
        syncActivitiesToAll();
        renderTable();
    }

    function tambahPotongan(wIdx) {
        const group = groups[currentGroupIndex];
        const newDed = { label: 'LAIN-LAIN', nilai: 0 };
        group.workers.forEach(w => { w.potongan.push(JSON.parse(JSON.stringify(newDed))); });
        renderTable();
    }

    function padamPotongan(wIdx, pIdx) {
        const group = groups[currentGroupIndex];
        const worker = group.workers[wIdx];
        if (worker.potongan.length <= 1) { alert('Tidak boleh padam potongan terakhir.'); return; }
        if (!confirm('Padam potongan ini?')) return;
        worker.potongan.splice(pIdx, 1);
        renderTable();
    }

    function tambahPekerja() {
        const group = groups[currentGroupIndex];
        const newWorker = {
            id: Date.now(), nama: 'PEKERJA BARU', noKP: 'XXXXXXXXXXXX', umur: 30, jantina: 'L',
            hari: Array(31).fill(''),
            aktiviti: group.workers.length > 0 ? JSON.parse(JSON.stringify(group.workers[0].aktiviti)) : [{ kod: '0101', nama: 'Menuai Sawit - Buah (kg)', unit: '', blok: '', kadar: 0.50, kuantitiHarian: Array(31).fill(0) }],
            elaun_motorsikal: 0, elaun_rumah: 0,
            potongan: group.workers.length > 0 ? JSON.parse(JSON.stringify(group.workers[0].potongan)) : [ { label: 'KWSP', nilai: 0 } ],
            leaveRates: group.workers.length > 0 ? JSON.parse(JSON.stringify(group.workers[0].leaveRates)) : {},
            afcCheck: Array(31).fill(false), fcCheck: Array(31).fill(false)
        };
        group.workers.push(newWorker);
        renderTable();
    }

    function padamPekerja(wIdx) {
        const group = groups[currentGroupIndex];
        if (group.workers.length <= 1) { alert('Tidak boleh padam pekerja terakhir.'); return; }
        if (!confirm('Padam pekerja ini?')) return;
        group.workers.splice(wIdx, 1);
        renderTable();
    }

    function updateButtons() {
        const isFC = currentUser && currentUser.role === 'FC';
        document.getElementById('btnTutup').style.display = (isFC && !isClosed) ? 'inline-block' : 'none';
        document.getElementById('btnBuka').style.display = (isFC && isClosed) ? 'inline-block' : 'none';
        document.getElementById('statusTutup').innerText = isClosed ? '🔒 Tutup' : '✅ Buka';
    }

    function toggleTutup() {
        if (currentUser.role !== 'FC') return;
        if (!isClosed) {
            if (!confirm('Tutup urusniaga ini? FS/AFC tidak boleh edit lagi.')) return;
            isClosed = true;
        } else {
            if (!confirm('Buka semula urusniaga ini?')) return;
            isClosed = false;
        }
        const bulan = document.getElementById('bulan').value;
        const tahun = document.getElementById('tahun').value;
        const key = `echeckroll_data_${tahun}_${bulan}`;
        const saved = localStorage.getItem(key);
        if (saved) {
            const data = JSON.parse(saved);
            data.isClosed = isClosed;
            localStorage.setItem(key, JSON.stringify(data));
        }
        updateButtons();
        renderTable();
    }

    function kiraSemua() { renderTable(); }

    // ============================================================
    //  SECTION 7: TABS / KUMPULAN LOGIC
    // ============================================================
    function addNewGroup() {
        const defaultPotongan = [ { label: 'KWSP', nilai: 0 }, { label: 'SOCSO', nilai: 0 }, { label: 'SIP', nilai: 0 } ];
        const newGroup = {
            id: nextGroupId++,
            name: 'Kumpulan ' + (groups.length + 1),
            workers: [{
                id: Date.now(), nama: 'PEKERJA BARU', noKP: 'XXXXXXXXXXXX', umur: 30, jantina: 'L',
                hari: Array(31).fill(''),
                aktiviti: [{ kod: '0101', nama: 'Menuai Sawit - Buah (kg)', unit: '', blok: '', kadar: 0.50, kuantitiHarian: Array(31).fill(0) }],
                elaun_motorsikal: 0, elaun_rumah: 0,
                potongan: JSON.parse(JSON.stringify(defaultPotongan)),
                leaveRates: {}, afcCheck: Array(31).fill(false), fcCheck: Array(31).fill(false)
            }]
        };
        groups.push(newGroup);
        renderTabs();
        currentGroupIndex = groups.length - 1;
        renderTable();
        updateButtons();
    }

    function renderTabs() {
        const container = document.getElementById('tabsContainer');
        let html = '';
        let visibleGroups = groups.map((g, idx) => idx);
        visibleGroups.forEach((idx) => {
            const g = groups[idx]; if (!g) return;
            const active = idx === currentGroupIndex ? 'active' : '';
            html += `<div class="tab-item ${active}" onclick="switchGroup(${idx})">
                <span class="tab-name" id="tab-name-${idx}" ondblclick="event.stopPropagation(); enableEdit(${idx})">${g.name}</span>
                <input class="tab-name-input" id="tab-input-${idx}" value="${g.name}" onblur="saveEdit(${idx})" onkeydown="if(event.key==='Enter') this.blur();" />
                <span class="close-tab" onclick="event.stopPropagation(); removeGroup(${idx})">×</span>
            </div>`;
        });
        if (currentUser.role !== 'AFC' && currentUser.role !== 'FC') {
            html += `<button class="btn-add-tab" onclick="addNewGroup()">+</button>`;
        }
        container.innerHTML = html;
    }

    function enableEdit(idx) {
        const span = document.getElementById(`tab-name-${idx}`);
        const input = document.getElementById(`tab-input-${idx}`);
        if(span && input) { span.style.display = 'none'; input.style.display = 'inline-block'; input.focus(); input.select(); }
    }

    function saveEdit(idx) {
        const span = document.getElementById(`tab-name-${idx}`);
        const input = document.getElementById(`tab-input-${idx}`);
        if(span && input) {
            const newName = input.value.trim() || groups[idx].name;
            if(groups[idx]) groups[idx].name = newName;
            span.innerText = newName; span.style.display = 'inline-block'; input.style.display = 'none';
        }
    }

    function switchGroup(idx) { currentGroupIndex = idx; renderTabs(); renderTable(); }

    function removeGroup(idx) {
        if (groups.length <= 1) { alert('Tidak boleh padam kumpulan terakhir.'); return; }
        if (!confirm('Padam kumpulan ini? (Pekerja di dalamnya akan turut terpadam)')) return;
        groups.splice(idx, 1);
        if (currentGroupIndex >= groups.length) currentGroupIndex = groups.length - 1;
        renderTabs(); renderTable();
    }

    // ============================================================
    //  SECTION 8: BOOT UP
    // ============================================================
    window.onload = function() { checkUser(); };
</script>
</body>
</html>
