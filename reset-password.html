<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Laluan - eCheckroll</title>
    
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        #forgotPage {
            position: relative; width: 100vw; height: 100vh;
            background: url('loginpic.png') no-repeat center center;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
        }
        #forgotPage::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .forgot-box {
            position: relative; z-index: 2;
            width: 420px; padding: 40px 35px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center; color: white;
        }

        .forgot-box h1 { margin: 0 0 5px 0; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
        .forgot-box p { margin: 0 0 20px 0; font-size: 14px; opacity: 0.9; }

        .forgot-group { position: relative; margin-bottom: 15px; text-align: left; }
        .forgot-group i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.8); font-size: 16px;
        }
        .forgot-group input {
            width: 100%; padding: 12px 15px 12px 45px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 30px;
            color: white; font-size: 14px; outline: none; transition: 0.3s;
        }
        .forgot-group input::placeholder { color: rgba(255,255,255,0.7); }
        .forgot-group input:focus { background: rgba(255, 255, 255, 0.3); border-color: #4caf50; }

        .forgot-btn {
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #2e7d32, #4caf50);
            border: none; border-radius: 30px;
            color: white; font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); transition: 0.3s;
            margin-top: 5px;
        }
        .forgot-btn:hover { transform: scale(1.02); }

        .forgot-error {
            color: #ffebee; margin-top: 12px; display: none;
            font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .forgot-success {
            color: #c8e6c9; margin-top: 12px; display: none;
            font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .forgot-success strong { font-size: 18px; color: #fff; background: rgba(0,0,0,0.3); padding: 4px 12px; border-radius: 6px; display: inline-block; margin-top: 6px; }

        .back-link { margin-top: 15px; display: block; color: rgba(255,255,255,0.8); text-decoration: underline; font-size: 13px; }
        .back-link:hover { color: white; }

        @media (max-width: 480px) {
            .forgot-box { width: 90%; padding: 25px 20px; }
        }
    </style>
</head>
<body>

<div id="forgotPage">
    <div class="forgot-box">
        <h1><i class="fas fa-key"></i> Lupa Kata Laluan</h1>
        <p>Masukkan No. Kakitangan anda. Kata laluan sementara akan dijana.</p>
        
        <div class="forgot-group">
            <i class="fas fa-user"></i>
            <input type="text" id="forgotId" placeholder="No. Kakitangan / ID">
        </div>
        
        <button class="forgot-btn" onclick="doForgot()">Hantar Permintaan</button>
        
        <div id="forgotError" class="forgot-error">Ralat berlaku. Sila cuba lagi.</div>
        <div id="forgotSuccess" class="forgot-success">
            ✅ Kata laluan sementara anda:<br>
            <strong id="newPasswordDisplay">------</strong><br><br>
            Sila <a href="login.html" style="color:#c8e6c9; font-weight:bold;">log masuk</a> menggunakan kata laluan ini, kemudian tukar segera.
        </div>
        
        <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Log Masuk</a>
    </div>
</div>

<script>
    // ============================================================
    //  FIX: Guna 'var' supaya tidak konflik dengan 'const' lain
    // ============================================================
    var SUPABASE_URL = 'https://kakzoykzxkryegqybxzs.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtha3pveWt6eGtyeWVncXlieHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTg2ODEsImV4cCI6MjEwMjA3NDY4MX0.n3L8mQsm3CNAC0ahEumu0bQMEC_9H2uaKQ4Htt_ga9c';
    
    var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function doForgot() {
        var id = document.getElementById('forgotId').value.trim();
        var errorBox = document.getElementById('forgotError');
        var successBox = document.getElementById('forgotSuccess');
        var passDisplay = document.getElementById('newPasswordDisplay');
        
        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        if (!id) {
            errorBox.innerText = 'Sila masukkan No. Kakitangan.';
            errorBox.style.display = 'block';
            return;
        }

        try {
            var { data, error } = await supabase
                .rpc('reset_password_mock', { p_id: id });

            if (error) {
                console.error('Supabase Error:', error);
                errorBox.innerText = 'Ralat sistem. Sila cuba lagi.';
                errorBox.style.display = 'block';
                return;
            }

            if (data && data.startsWith('ERROR:')) {
                errorBox.innerText = data;
                errorBox.style.display = 'block';
                return;
            }

            // Papar password baru
            passDisplay.innerText = data;
            successBox.style.display = 'block';

        } catch (err) {
            console.error('Unexpected Error:', err);
            errorBox.innerText = 'Ralat tidak dijangka. Sila semak konsol.';
            errorBox.style.display = 'block';
        }
    }
</script>
</body>
</html>
