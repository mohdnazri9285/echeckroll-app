<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tukar Kata Laluan - eCheckroll</title>
    
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        #resetPage {
            position: relative; width: 100vw; height: 100vh;
            background: url('loginpic.png') no-repeat center center;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
        }
        #resetPage::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .reset-box {
            position: relative; z-index: 2;
            width: 420px; padding: 40px 35px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center; color: white;
        }

        .reset-box h1 { margin: 0 0 5px 0; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
        .reset-box p { margin: 0 0 25px 0; font-size: 14px; opacity: 0.9; }

        .reset-group { position: relative; margin-bottom: 15px; text-align: left; }
        .reset-group i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.8); font-size: 16px;
        }
        .reset-group input {
            width: 100%; padding: 12px 15px 12px 45px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 30px;
            color: white; font-size: 14px; outline: none; transition: 0.3s;
        }
        .reset-group input::placeholder { color: rgba(255,255,255,0.7); }
        .reset-group input:focus { background: rgba(255, 255, 255, 0.3); border-color: #4caf50; }

        .reset-btn {
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #2e7d32, #4caf50);
            border: none; border-radius: 30px;
            color: white; font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); transition: 0.3s;
            margin-top: 5px;
        }
        .reset-btn:hover { transform: scale(1.02); }

        .reset-error {
            color: #ffebee; margin-top: 12px; display: none;
            font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .reset-success {
            color: #c8e6c9; margin-top: 12px; display: none;
            font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .back-link { margin-top: 15px; display: block; color: rgba(255,255,255,0.8); text-decoration: underline; font-size: 13px; }
        .back-link:hover { color: white; }

        @media (max-width: 480px) {
            .reset-box { width: 90%; padding: 25px 20px; }
        }
    </style>
</head>
<body>

<div id="resetPage">
    <div class="reset-box">
        <h1><i class="fas fa-key"></i> Tukar Kata Laluan</h1>
        <p>Masukkan ID dan kata laluan anda untuk menukar kata laluan baharu.</p>
        
        <div class="reset-group">
            <i class="fas fa-user"></i>
            <input type="text" id="resetId" placeholder="No. Kakitangan / ID">
        </div>
        <div class="reset-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="resetOldPass" placeholder="Kata Laluan Lama">
        </div>
        <div class="reset-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="resetNewPass" placeholder="Kata Laluan Baharu">
        </div>
        <div class="reset-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="resetConfirmPass" placeholder="Sahkan Kata Laluan Baharu">
        </div>
        
        <button class="reset-btn" onclick="doReset()">Kemaskini Kata Laluan</button>
        
        <div id="resetError" class="reset-error">Ralat berlaku. Sila cuba lagi.</div>
        <div id="resetSuccess" class="reset-success">✅ Kata laluan berjaya dikemaskini! Klik <a href="login.html" style="color:#c8e6c9; font-weight:bold;">di sini</a> untuk log masuk.</div>
        
        <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Log Masuk</a>
    </div>
</div>

<script>
    // ============================================================
    //  SUPABASE CONFIGURATION (SAMA SEPERTI LOGIN)
    // ============================================================
    const SUPABASE_URL = 'https://kakzoykzxkryegqybxzs.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtha3pveWt6eGtyeWVncXlieHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTg2ODEsImV4cCI6MjEwMjA3NDY4MX0.n3L8mQsm3CNAC0ahEumu0bQMEC_9H2uaKQ4Htt_ga9c';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function doReset() {
        const id = document.getElementById('resetId').value.trim();
        const oldPass = document.getElementById('resetOldPass').value.trim();
        const newPass = document.getElementById('resetNewPass').value.trim();
        const confirmPass = document.getElementById('resetConfirmPass').value.trim();
        
        const errorBox = document.getElementById('resetError');
        const successBox = document.getElementById('resetSuccess');
        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        if (!id || !oldPass || !newPass || !confirmPass) {
            errorBox.innerText = 'Sila isi semua ruangan.';
            errorBox.style.display = 'block';
            return;
        }

        if (newPass !== confirmPass) {
            errorBox.innerText = 'Kata laluan baharu tidak sepadan.';
            errorBox.style.display = 'block';
            return;
        }

        if (newPass.length < 6) {
            errorBox.innerText = 'Kata laluan baharu mestilah sekurang-kurangnya 6 aksara.';
            errorBox.style.display = 'block';
            return;
        }

        try {
            // Panggil fungsi update_user_password di Supabase
            const { data, error } = await supabase
                .rpc('update_user_password', { 
                    p_id: id, 
                    p_old_password: oldPass, 
                    p_new_password: newPass
                });

            if (error) {
                console.error('Supabase Error:', error);
                errorBox.innerText = 'Ralat sistem. Sila cuba lagi.';
                errorBox.style.display = 'block';
                return;
            }

            // Jika data pulang FALSE, password lama salah
            if (data === false) {
                errorBox.innerText = 'ID atau Kata Laluan Lama salah!';
                errorBox.style.display = 'block';
                return;
            }

            // Berjaya!
            document.getElementById('resetId').value = '';
            document.getElementById('resetOldPass').value = '';
            document.getElementById('resetNewPass').value = '';
            document.getElementById('resetConfirmPass').value = '';
            successBox.style.display = 'block';

        } catch (err) {
            console.error('Unexpected Error:', err);
            errorBox.innerText = 'Ralat tidak dijangka. Sila semak konsol.';
            errorBox.style.display = 'block';
        }
    }
</script>
</body>
</html>
