<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Laluan - eCheckroll FPMSB</title>
    
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        #resetPage {
            position: relative; width: 100vw; height: 100vh;
            background: url('loginpic.png') no-repeat center center;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
        }
        #resetPage::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .reset-box {
            position: relative; z-index: 2;
            width: 420px; padding: 40px 35px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center; color: white;
        }

        .reset-box h1 { margin: 0 0 5px 0; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
        .reset-box p { margin: 0 0 25px 0; font-size: 14px; opacity: 0.9; }

        .reset-group { position: relative; margin-bottom: 15px; text-align: left; }
        .reset-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.8); font-size: 16px; }
        .reset-group input {
            width: 100%; padding: 12px 15px 12px 45px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 30px;
            color: white; font-size: 14px; outline: none; transition: 0.3s;
        }
        .reset-group input::placeholder { color: rgba(255,255,255,0.7); }
        .reset-group input:focus { background: rgba(255, 255, 255, 0.3); border-color: #4caf50; }

        .reset-btn {
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #2e7d32, #4caf50);
            border: none; border-radius: 30px;
            color: white; font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); transition: 0.3s; margin-top: 5px;
        }
        .reset-btn:hover { transform: scale(1.02); }

        .reset-error { color: #ffebee; margin-top: 12px; display: none; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .reset-success { color: #c8e6c9; margin-top: 12px; display: none; font-size: 14px; }
        .reset-success strong { font-size: 18px; color: #fff; background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 6px; display: inline-block; margin-top: 6px; }
        
        /* Butang Log Masuk Sekarang */
        .btn-login-now {
            display: none;
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #1976d2, #42a5f5);
            border: none; border-radius: 30px;
            color: white; font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.4); transition: 0.3s;
            margin-top: 10px;
            text-decoration: none; display: inline-block;
        }
        .btn-login-now:hover { transform: scale(1.02); text-decoration: none; color: white; }

        /* Butang Tukar Kata Laluan Sekarang (BARU) */
        .btn-change-now {
            display: none;
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #ef6c00, #ff9800);
            border: none; border-radius: 30px;
            color: white; font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 108, 0, 0.4); transition: 0.3s;
            margin-top: 10px;
            text-decoration: none;
        }
        .btn-change-now:hover { transform: scale(1.02); text-decoration: none; color: white; }

        /* Borang Tukar Password Baharu (Sebelumnya tersembunyi) */
        #changePasswordForm {
            display: none;
            margin-top: 15px;
            text-align: left;
            width: 100%;
        }
        .pass-input {
            width: 100%; padding: 10px 15px;
            border-radius: 30px; border: none;
            background: rgba(0,0,0,0.2);
            color: white; font-size: 14px; outline: none; margin-bottom: 8px;
        }
        .pass-input::placeholder { color: rgba(255,255,255,0.7); }
        .pass-input:focus { background: rgba(255,255,255,0.2); }
        .btn-save-pass {
            width: 100%; padding: 10px;
            background: #2e7d32; border: none; border-radius: 30px;
            color: white; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 5px;
        }
        .btn-save-pass:hover { background: #4caf50; }

        .back-link { margin-top: 15px; display: block; color: rgba(255,255,255,0.8); text-decoration: underline; font-size: 13px; }
        .back-link:hover { color: white; }

        @media (max-width: 480px) { .reset-box { width: 90%; padding: 25px 20px; } }
    </style>
</head>
<body>

<div id="resetPage">
    <div class="reset-box">
        <h1><i class="fas fa-key"></i> Tukar Kata Laluan</h1>
        <p>Masukkan No. Kakitangan anda. Kata laluan sementara akan dijana.</p>
        
        <div class="reset-group">
            <i class="fas fa-user"></i>
            <input type="text" id="resetId" placeholder="No. Kakitangan / ID">
        </div>
        
        <button class="reset-btn" onclick="doReset()" id="submitBtn">Hantar Permintaan</button>
        
        <div id="resetError" class="reset-error">Ralat berlaku. Sila cuba lagi.</div>
        
        <div id="resetSuccess" class="reset-success">
            ✅ Kata laluan sementara anda:<br>
            <strong id="newPasswordDisplay">------</strong><br><br>
            <span style="font-size:12px; opacity:0.8;">*Sila log masuk menggunakan kata laluan ini.</span><br>

            <a href="login.html" class="btn-login-now" id="loginNowBtn">
                <i class="fas fa-sign-in-alt"></i> Log Masuk Sekarang
            </a>
            <button class="btn-change-now" id="changeNowBtn" onclick="toggleChangeForm()">
                <i class="fas fa-sync-alt"></i> Tukar Kata Laluan Sekarang
            </button>

            <!-- Borang untuk pengguna tukar password (dengan *****) -->
            <div id="changePasswordForm">
                <input type="password" class="pass-input" id="newPassInput" placeholder="Kata Laluan Baharu (min 6 aksara)">
                <input type="password" class="pass-input" id="confirmPassInput" placeholder="Sahkan Kata Laluan Baharu">
                <button class="btn-save-pass" onclick="saveCustomPassword()">💾 Simpan Kata Laluan Baharu</button>
                <div id="changeError" style="color:#ffebee; font-size:13px; margin-top:5px; display:none;"></div>
            </div>
        </div>
        
        <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Log Masuk</a>
    </div>
</div>

<script>
    var SUPABASE_URL = 'https://kakzoykzxkryegqybxzs.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtha3pveWt6eGtyeWVncXlieHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTg2ODEsImV4cCI6MjEwMjA3NDY4MX0.n3L8mQsm3CNAC0ahEumu0bQMEC_9H2uaKQ4Htt_ga9c';
    var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var lastGeneratedPassword = '';
    var lastGeneratedId = '';

    async function doReset() {
        var id = document.getElementById('resetId').value.trim();
        var errorBox = document.getElementById('resetError');
        var successBox = document.getElementById('resetSuccess');
        var passDisplay = document.getElementById('newPasswordDisplay');
        var loginBtn = document.getElementById('loginNowBtn');
        var changeBtn = document.getElementById('changeNowBtn');
        var submitBtn = document.getElementById('submitBtn');
        var formBox = document.getElementById('changePasswordForm');
        
        errorBox.style.display = 'none';
        successBox.style.display = 'none';
        loginBtn.style.display = 'none';
        changeBtn.style.display = 'none';
        formBox.style.display = 'none';

        if (!id) {
            errorBox.innerText = 'Sila masukkan No. Kakitangan.';
            errorBox.style.display = 'block';
            return;
        }

        lastGeneratedId = id;
        submitBtn.disabled = true;
        submitBtn.innerText = 'Memproses...';

        try {
            var { data, error } = await supabase
                .rpc('reset_password_mock', { p_id: id });

            if (error) {
                console.error('Supabase Error:', error);
                errorBox.innerText = 'Ralat sistem: ' + error.message;
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Hantar Permintaan';
                return;
            }

            if (data && data.startsWith('ERROR:')) {
                errorBox.innerText = data;
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Hantar Permintaan';
                return;
            }

            lastGeneratedPassword = data;
            passDisplay.innerText = data;
            successBox.style.display = 'block';
            loginBtn.style.display = 'inline-block';
            changeBtn.style.display = 'inline-block'; // Show Change Password button
            
            submitBtn.disabled = false;
            submitBtn.innerText = 'Hantar Permintaan';

        } catch (err) {
            console.error('Unexpected Error:', err);
            errorBox.innerText = 'Ralat tidak dijangka. Sila semak konsol.';
            errorBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerText = 'Hantar Permintaan';
        }
    }

    function toggleChangeForm() {
        var formBox = document.getElementById('changePasswordForm');
        if (formBox.style.display === 'none') {
            formBox.style.display = 'block';
        } else {
            formBox.style.display = 'none';
        }
    }

    async function saveCustomPassword() {
        var newPass = document.getElementById('newPassInput').value.trim();
        var confirmPass = document.getElementById('confirmPassInput').value.trim();
        var errorBox = document.getElementById('changeError');
        errorBox.style.display = 'none';

        if (newPass.length < 6) {
            errorBox.innerText = 'Kata laluan baharu mestilah sekurang-kurangnya 6 aksara.';
            errorBox.style.display = 'block';
            return;
        }
        if (newPass !== confirmPass) {
            errorBox.innerText = 'Kata laluan tidak sepadan. Sila sahkan semula.';
            errorBox.style.display = 'block';
            return;
        }

        try {
            // Guna fungsi update_user_password. Password lama = password sementara.
            var { data, error } = await supabase
                .rpc('update_user_password', { 
                    p_id: lastGeneratedId, 
                    p_old_password: lastGeneratedPassword, 
                    p_new_password: newPass 
                });

            if (error) {
                console.error('Supabase Error:', error);
                errorBox.innerText = 'Ralat sistem: ' + error.message;
                errorBox.style.display = 'block';
                return;
            }

            if (data === false) {
                errorBox.innerText = 'Ralat: Kata laluan sementara mungkin telah tamat atau ID salah.';
                errorBox.style.display = 'block';
                return;
            }

            // Berjaya!
            alert('✅ Kata laluan anda berjaya dikemaskini! Sila log masuk menggunakan kata laluan baharu.');
            window.location.href = 'login.html';

        } catch (err) {
            console.error('Unexpected Error:', err);
            errorBox.innerText = 'Ralat tidak dijangka. Sila semak konsol.';
            errorBox.style.display = 'block';
        }
    }
</script>
</body>
</html>
